<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        /*flex = flex-grow, flex-shrink, flex-basis*/
        .container{
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }

        .item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
        }

        #caixaa{
            /*flex-grow: 2;    
            flex-shrink: 0;
            flex-basis: 200px;*/
            flex: 2 0 200px;
        }

        #caixab{
            /*flex-grow: 4;
            flex-shrink: 1;
            flex-basis: 150px;*/     
            flex: 1 4 150px;       
        }

        #caixac{
            /*flex-grow: 1;
            flex-shrink: 8;
            flex-basis: auto;*/
            flex: 1 8 auto;
        }

        /*
            flex: 0 1 auto; //padrao
            ou
            flex: initial;

            flex: 0 0 auto;
            ou
            flex: none;

            flex 1 1 auto;
            ou
            flex: auto;

            flex: 3; // esta dizendo que apenas o flex-grow vira 3 e os demais permanecem padrão
        */
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="caixaa">A</div>
        <div class="item" id="caixab">B</div>
        <div class="item" id="caixac">C</div>
    </div>
</body>
</html>
